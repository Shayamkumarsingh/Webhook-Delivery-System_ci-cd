apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-service
  namespace: webhook-platform
  labels:
    app: delivery-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: delivery-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: delivery-service
    spec:
      containers:
        - name: delivery-service
          image: your-dockerhub/delivery-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5004
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: webhook-platform-config
                  key: DELIVERY_SERVICE_PORT
            - name: POSTGRES_URI
              valueFrom:
                secretKeyRef:
                  name: webhook-platform-secrets
                  key: DELIVERY_POSTGRES_URI
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: webhook-platform-config
                  key: KAFKA_BROKER
            - name: WEBHOOK_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: webhook-platform-config
                  key: WEBHOOK_SERVICE_URL
            - name: INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: webhook-platform-secrets
                  key: INTERNAL_SECRET
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: webhook-platform-config
                  key: NODE_ENV
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: delivery-service
  namespace: webhook-platform
  labels:
    app: delivery-service
spec:
  selector:
    app: delivery-service
  ports:
    - name: http
      port: 5004
      targetPort: 5004
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: delivery-service-hpa
  namespace: webhook-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: delivery-service
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 3
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120