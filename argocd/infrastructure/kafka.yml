apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
  labels:
    app: kafka
    tier: infrastructure
spec:
  project: webhook-platform

  source:
    repoURL: https://github.com/your-username/your-repo.git
    targetRevision: main
    path: k8s/infrastructure
    directory:
      include: "kafka.yml"

  destination:
    server: https://kubernetes.default.svc
    namespace: webhook-platform

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

  revisionHistoryLimit: 5