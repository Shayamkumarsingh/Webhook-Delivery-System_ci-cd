apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: webhook-platform
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: your-dockerhub/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: AUTH_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: webhook-platform-config
                  key: AUTH_SERVICE_URL
            - name: WEBHOOK_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: webhook-platform-config
                  key: WEBHOOK_SERVICE_URL
            - name: EVENT_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: webhook-platform-config
                  key: EVENT_SERVICE_URL
            - name: DELIVERY_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: webhook-platform-config
                  key: DELIVERY_SERVICE_URL
            - name: RETRY_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: webhook-platform-config
                  key: RETRY_SERVICE_URL
            - name: DLQ_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: webhook-platform-config
                  key: DLQ_SERVICE_URL
            - name: NOTIFICATION_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: webhook-platform-config
                  key: NOTIFICATION_SERVICE_URL
            - name: LOGS_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: webhook-platform-config
                  key: LOGS_SERVICE_URL
            - name: RATE_LIMIT_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: webhook-platform-config
                  key: RATE_LIMIT_SERVICE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: webhook-platform-secrets
                  key: JWT_SECRET
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: webhook-platform-config
                  key: NODE_ENV
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: webhook-platform
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 5000
      targetPort: 5000
  type: LoadBalancer

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: webhook-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120