apiVersion: apps/v1
kind: Deployment
metadata:
  name: retry-service
  namespace: webhook-platform
  labels:
    app: retry-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retry-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: retry-service
    spec:
      containers:
        - name: retry-service
          image: your-dockerhub/retry-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5005
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: webhook-platform-config
                  key: RETRY_SERVICE_PORT
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: webhook-platform-config
                  key: KAFKA_BROKER
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: webhook-platform-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: webhook-platform-config
                  key: REDIS_PORT
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: webhook-platform-config
                  key: NODE_ENV
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5005
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5005
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: retry-service
  namespace: webhook-platform
  labels:
    app: retry-service
spec:
  selector:
    app: retry-service
  ports:
    - name: http
      port: 5005
      targetPort: 5005
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: retry-service-hpa
  namespace: webhook-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: retry-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120